components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    cookieAuth: { type: apiKey, in: cookie, name: zaraff_token }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [kode, pesan]
          properties:
            kode: { type: string }
            pesan: { type: string }
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    PaymentInput:
      type: object
      additionalProperties: false
      required: [metode]
      description: "Transfer wajib buktiBayar. Jumlah berasal dari invoice; jika dikirim harus sama dengan jumlah invoice."
      properties:
        metode: { type: string, enum: [transfer, deposit] }
        buktiBayar: { type: string, minLength: 1 }
        jumlah: { type: integer, minimum: 0 }
    PaymentContractInput:
      allOf:
        - type: object
          required: [idTagihan, metode]
          properties:
            idTagihan: { type: string }
            metode: { type: string, enum: [transfer, deposit] }
            buktiBayar: { type: string, minLength: 1 }
            jumlah: { type: integer, minimum: 0 }
    ValidatePaymentInput:
      type: object
      additionalProperties: false
      required: [keputusan]
      description: "Keputusan tolak wajib alasan; setuju mengubah payment/invoice/order dan stok dalam satu transaksi."
      properties:
        keputusan: { type: string, enum: [setuju, tolak] }
        alasan: { type: string, minLength: 1 }
    QualityCheckInput:
      type: object
      additionalProperties: false
      required: [kodeDitemukan]
      properties:
        kodeDitemukan:
          { type: array, minItems: 1, items: { type: string, minLength: 1 } }
    HandoverInput:
      type: object
      additionalProperties: false
      required: [kurir, noResi]
      properties:
        kurir: { type: string, minLength: 1 }
        noResi: { type: string, minLength: 1 }
    ShipmentStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [diserahkan, dalam perjalanan, diterima] }
        catatan: { type: string, minLength: 1 }
    DeliveryInput:
      type: object
      additionalProperties: false
      required: [noResi, status]
      properties:
        noResi: { type: string, minLength: 1 }
        status: { type: string, enum: [diserahkan, dalam perjalanan, diterima] }
    StrategyInput:
      type: object
      additionalProperties: false
      required: [periode, isi, penerimaUserIds]
      properties:
        periode: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' }
        isi: { type: string, minLength: 1 }
        penerimaUserIds:
          { type: array, minItems: 1, items: { type: string, minLength: 1 } }
    ClaimInput:
      type: object
      additionalProperties: false
      required: [kodeProduk, idPembeli, handlePembeli, waktuKomentar]
      properties:
        kodeProduk: { type: string, minLength: 1 }
        idPembeli: { type: string, minLength: 1 }
        handlePembeli: { type: string, minLength: 1 }
        waktuKomentar: { type: string, format: date-time }
